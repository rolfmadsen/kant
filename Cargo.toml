[workspace]
members = [
    ".",
    "crates/kant-relay",
]
resolver = "2"

[workspace.package]
version = "0.8.6"
edition = "2021"
authors = ["Rolf Madsen"]
license = "MIT"

[package]
name = "kant"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Desktop applikation til FDA begrebs- og informationsmodellering i Rust og Iced"

[package.metadata.deb]
maintainer = "Rolf Madsen"
copyright = "2026 Rolf Madsen"
license-file = ["LICENSE", "0"]
extended-description = "Kant er en moderne skrivebordsapplikation til FDA begrebs- og informationsmodellering bygget i Rust og Iced."
section = "graphics"
priority = "optional"
assets = [
    ["target/release/kant", "usr/bin/kant", "755"],
    ["assets/kant.desktop", "usr/share/applications/kant.desktop", "644"],
    ["assets/icons/kant.svg", "usr/share/icons/hicolor/scalable/apps/kant.svg", "644"],
    ["assets/icons/kant-48.png", "usr/share/icons/hicolor/48x48/apps/kant.png", "644"],
    ["assets/icons/kant-128.png", "usr/share/icons/hicolor/128x128/apps/kant.png", "644"],
    ["assets/icons/kant-256.png", "usr/share/icons/hicolor/256x256/apps/kant.png", "644"],
    ["assets/icons/kant-256.png", "usr/share/pixmaps/kant.png", "644"],
]

[dependencies]
iced = { version = "0.14.0", features = ["wgpu", "tiny-skia", "canvas", "svg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
url = { version = "2.5", features = ["serde"] }
thiserror = "1.0"
libc = "0.2"
chacha20poly1305 = "0.10"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
base64 = "0.22"
rand = "0.9"
futures-util = "0.3"
bytes = "1.10"
rfd = "0.15"
calamine = "0.26"
rust_xlsxwriter = "0.80"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
proptest = "1.5"
kant-relay = { path = "crates/kant-relay" }
axum = "0.8"
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
png = "0.17"

[[test]]
name = "export_acceptance"
path = "tests/features/export_acceptance_test.rs"

[[test]]
name = "collab_acceptance"
path = "tests/features/collab_acceptance_test.rs"

[[test]]
name = "canvas_acceptance"
path = "tests/features/canvas_acceptance_test.rs"
[[test]]
name = "git_acceptance"
path = "tests/features/git_acceptance_test.rs"

[[test]]
name = "information_model_acceptance"
path = "tests/features/information_model_acceptance_test.rs"
