name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: kant-linux-x86_64
            archive_file: kant-linux-x86_64.tar.gz
            is_windows: false

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: kant-macos-aarch64
            archive_file: kant-macos-aarch64.tar.gz
            is_windows: false

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: kant-windows-x86_64
            archive_file: kant-windows-x86_64.zip
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan1 \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Build release binary (Windows static CRT)
        if: ${{ matrix.is_windows }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release binary (Unix)
        if: ${{ !matrix.is_windows }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: ${{ !matrix.is_windows }}
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/kant" dist/
          chmod +x dist/kant
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar -czf "${{ matrix.archive_file }}" -C dist .
          shasum -a 256 "${{ matrix.archive_file }}" > "${{ matrix.archive_file }}.sha256"

      - name: Install cargo-deb
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-deb

      - name: Package Debian package (.deb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo deb --no-build --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb .
          for f in *.deb; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Package release archive (Windows)
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/kant.exe" -Destination dist/
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination dist/ }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination dist/ }
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive_file }}"
          $hash = (Get-FileHash -Algorithm SHA256 -Path "${{ matrix.archive_file }}").Hash.ToLower()
          "$hash  ${{ matrix.archive_file }}" | Out-File -Encoding ascii "${{ matrix.archive_file }}.sha256"

          # --- Windows Store MSIX Packaging ---
          Write-Host "Locating Windows SDK MakeAppx.exe..."
          $sdkBins = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object Name -Descending
          $makeAppxPath = $null
          foreach ($sdk in $sdkBins) {
              $candidate = Join-Path $sdk.FullName "x64\makeappx.exe"
              if (Test-Path $candidate) {
                  $makeAppxPath = $candidate
                  break
              }
          }
          if (-not $makeAppxPath) {
              throw "makeappx.exe was not found in Windows SDK directories on runner."
          }
          Write-Host "Found MakeAppx at: $makeAppxPath"

          # Klargør MSIX staging layout
          New-Item -ItemType Directory -Force -Path dist-msix
          New-Item -ItemType Directory -Force -Path dist-msix/images
          Copy-Item "target/${{ matrix.target }}/release/kant.exe" -Destination dist-msix/
          Copy-Item "assets/windows/images/*" -Destination dist-msix/images/

          # Tilpas version i AppxManifest (fx v0.8.1 -> 0.8.1.0)
          $appVersion = "0.8.1.0"
          if ("${{ github.ref }}" -match 'refs/tags/v?(\d+\.\d+\.\d+)') {
              $appVersion = "$($Matches[1]).0"
          }
          $manifestContent = Get-Content "assets/windows/AppxManifest.xml" -Raw
          $manifestContent = $manifestContent -replace 'Version="[^"]+"', "Version=`"$appVersion`""
          $manifestContent | Set-Content -Encoding utf8 "dist-msix/AppxManifest.xml"

          # Pak MSIX (uden validering af certifikat, da Store re-signerer)
          $msixFile = "kant-windows-x86_64.msix"
          & $makeAppxPath pack /d dist-msix /p $msixFile /nv
          $msixHash = (Get-FileHash -Algorithm SHA256 -Path $msixFile).Hash.ToLower()
          "$msixHash  $msixFile" | Out-File -Encoding ascii "$msixFile.sha256"
          Write-Host "MSIX pakke oprettet: $msixFile (SHA256: $msixHash)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.archive_file }}
            ${{ matrix.archive_file }}.sha256
            *.msix
            *.msix.sha256
            *.deb
            *.deb.sha256
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
