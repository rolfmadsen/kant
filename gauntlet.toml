# xGauntlet Declarative Configuration
stack = "rust"
save_evidence = true
evidence_file = "verification-report.json"
evidence_markdown_file = "evidence.md"

[paths]
tasks_dir = "tasks"
spec_file = "spec.md"
context_file = "CONTEXT.md"
coding_standards_file = "CODING_STANDARDS.md"

[architecture]
max_file_lines = 800
max_test_file_lines = 1000
forbidden_tokens = ["Color::from_rgb", "Color::from_rgba"]

[[architecture.exemptions]]
path = "src/ui/app.rs"
reason = "Desktop app shell, state router og UI orchestrator; ratchet loft"
adr = "docs/adr/015-accessible-design-tokens-and-decomposed-ui-slices.md"
max_lines = 9200

[[architecture.exemptions]]
path = "tests/acceptance.rs"
reason = "Monolitisk multi-feature accepttest-suite; ratchet loft"
adr = "docs/adr/015-accessible-design-tokens-and-decomposed-ui-slices.md"
max_lines = 9500

[[architecture.exemptions]]
path = "src/features/model/merge.rs"
reason = "Semantisk 3-vejs model merge motor; ratchet loft"
adr = "docs/adr/011-decomposed-model-persistence-and-git-integration.md"
max_lines = 1200

[[architecture.exemptions]]
path = "src/features/git/service.rs"
reason = "Git integrations- og synkroniseringsservice; ratchet loft"
adr = "docs/adr/011-decomposed-model-persistence-and-git-integration.md"
max_lines = 1000

[[layers]]
name = "architecture"
command = ["xgauntlet", "check-architecture"]
optional = false
timeout_seconds = 30.0

[[layers]]
name = "spec"
command = ["xgauntlet", "check-spec"]
optional = false
timeout_seconds = 30.0

[[layers]]
name = "lint"
command = ["cargo", "clippy", "--", "-D", "warnings"]
optional = true
timeout_seconds = 60.0

[[layers]]
name = "types"
command = ["cargo", "check"]
optional = true
timeout_seconds = 60.0

[[layers]]
name = "unit"
command = ["cargo", "test"]
optional = false
timeout_seconds = 120.0

[[layers]]
name = "invariants"
command = ["cargo", "test", "--", "proptest"]
optional = false
timeout_seconds = 120.0


