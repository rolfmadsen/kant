# xGauntlet Declarative Configuration
stack = "rust"
save_evidence = true
evidence_file = "verification-report.json"
evidence_markdown_file = "evidence.md"

[paths]
tasks_dir = "tasks"
spec_file = "spec.md"
context_file = "CONTEXT.md"
coding_standards_file = "CODING_STANDARDS.md"

[architecture]
max_file_lines = 800
max_test_file_lines = 1000
forbidden_tokens = ["Color::from_rgb", "Color::from_rgba"]

[[architecture.exemptions]]
path = "src/ui/app.rs"
reason = "Desktop app shell, state router og UI orchestrator; ratchet loft"
max_lines = 9200

[[architecture.exemptions]]
path = "tests/acceptance.rs"
reason = "Monolitisk multi-feature accepttest-suite; ratchet loft"
max_lines = 9500


[[architecture.exemptions]]
path = "src/ui/information_model_view.rs"
reason = "Informationsmodel visning og klasse-relation editor; ratchet loft"
max_lines = 1950

[[architecture.exemptions]]
path = "src/features/information_model/mod.rs"
reason = "Informationsmodel domænemodel, relationer og attributter; ratchet loft"
max_lines = 1750

[[architecture.exemptions]]
path = "src/features/model/merge.rs"
reason = "Semantisk 3-vejs model merge motor; ratchet loft"
max_lines = 1200

[[architecture.exemptions]]
path = "src/features/git/service.rs"
reason = "Git integrations- og synkroniseringsservice; ratchet loft"
max_lines = 1000

[[architecture.exemptions]]
path = "src/ui/concept_model_view.rs"
reason = "Begrebsmodel grafvisning og editor; ratchet loft"
max_lines = 900

[[architecture.exemptions]]
path = "src/ui/concept_editor.rs"
reason = "Begrebsliste modal editor og validering; ratchet loft"
max_lines = 900

[[architecture.exemptions]]
path = "src/ui/edge_router.rs"
reason = "Ortogonal Manhattan relation routing og port bundling; ratchet loft"
max_lines = 900

[[architecture.exemptions]]
path = "src/features/concepts/excel.rs"
reason = "Excel import, eksport og skabelongenerering; ratchet loft"
max_lines = 850

[[layers]]
name = "architecture"
command = ["xgauntlet", "check-architecture"]
optional = false
timeout_seconds = 30.0

[[layers]]
name = "spec"
command = ["xgauntlet", "check-spec"]
optional = false
timeout_seconds = 30.0

[[layers]]
name = "lint"
command = ["cargo", "clippy", "--", "-D", "warnings"]
optional = true
timeout_seconds = 60.0

[[layers]]
name = "types"
command = ["cargo", "check"]
optional = true
timeout_seconds = 60.0

[[layers]]
name = "unit"
command = ["cargo", "test"]
optional = false
timeout_seconds = 120.0

[[layers]]
name = "invariants"
command = ["cargo", "test", "--", "proptest"]
optional = false
timeout_seconds = 120.0


